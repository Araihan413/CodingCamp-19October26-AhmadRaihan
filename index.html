<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="To-Do List Life Dashboard — personal productivity homepage with clock, timer, tasks, and quick links." />
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- Toast notification container -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- Main dashboard grid -->
  <main class="dashboard-grid" id="dashboard-grid">

    <!-- ── Theme Toggle Panel (Top Center Camera Notch) ── -->
    <section class="glass-panel panel-theme" id="panel-theme" aria-label="Theme settings">
      <span class="theme-icon" id="theme-icon-light" aria-hidden="true">☀️</span>
      <span class="theme-label">Theme</span>
      <button type="button" class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false"
        aria-label="Toggle dark theme"></button>
      <span class="theme-icon" id="theme-icon-dark" aria-hidden="true">🌙</span>
    </section>

    <!-- ── Clock & Greeting Panel ── -->
    <section class="glass-panel panel-clock" id="panel-clock" aria-label="Clock and greeting">
      <!-- Loading skeleton -->
      <div class="skeleton-block skeleton-clock-time" aria-hidden="true"></div>
      <div class="skeleton-block skeleton-clock-date" aria-hidden="true"></div>

      <time class="clock-time" id="clock-time" aria-live="off">00:00:00</time>
      <p class="clock-date" id="clock-date"></p>
      <p class="greeting-line" id="greeting-line" aria-live="polite">Good Morning, Friend</p>

      <div class="name-input-wrapper" id="name-input-wrapper">
        <label for="name-input" class="sr-only">Your display name</label>
        <input type="text" id="name-input" class="glass-input" placeholder="Enter your name…" maxlength="50"
          autocomplete="off" aria-label="Your display name" />
        <button type="button" class="btn-confirm" id="name-confirm-btn" aria-label="Confirm name">
          ✓
        </button>
      </div>
      <div class="validation-msg" id="validation-name-input" role="alert" aria-live="assertive"></div>
    </section>



    <!-- ── Focus Timer Panel ── -->
    <section class="glass-panel panel-timer" id="panel-timer" aria-label="Focus timer">
      <!-- Loading skeleton -->
      <div class="skeleton-block skeleton-timer-ring" aria-hidden="true"></div>

      <h2 class="panel-title">Focus Timer</h2>

      <!-- SVG progress ring (populated by Renderer) -->
      <div class="timer-ring-wrapper" id="timer-ring-wrapper" aria-hidden="true">
        <svg class="timer-ring-svg" viewBox="0 0 160 160" width="160" height="160" aria-hidden="true">
          <!-- Track circle -->
          <circle class="timer-ring-track" cx="80" cy="80" r="68" fill="none" stroke-width="8" />
          <!-- Progress circle -->
          <circle class="timer-ring-progress" id="timer-ring-progress" cx="80" cy="80" r="68" fill="none"
            stroke-width="8" stroke-linecap="round" transform="rotate(-90 80 80)" stroke-dasharray="427.26"
            stroke-dashoffset="0" />
        </svg>
        <div class="timer-display" id="timer-display" aria-live="off" aria-label="Remaining time">25:00</div>
      </div>

      <div class="timer-controls" role="group" aria-label="Timer controls">
        <button type="button" class="btn-icon-primary" id="timer-start-btn" aria-label="Start timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
        <button type="button" class="btn-icon-secondary hidden" id="timer-stop-btn" aria-label="Pause timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
        <button type="button" class="btn-icon-secondary" id="timer-reset-btn" aria-label="Reset timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
          </svg>
        </button>
      </div>

      <div class="timer-duration-input-wrapper">
        <label for="timer-duration-input" class="timer-duration-label">Duration (min):</label>
        <input type="number" id="timer-duration-input" class="glass-input timer-duration-input" value="25" min="1"
          max="120" step="1" aria-label="Timer duration in minutes" />
        <button type="button" class="btn-confirm btn-sm" id="timer-duration-confirm-btn" aria-label="Set duration">
          Set
        </button>
      </div>
      <div class="validation-msg timer-validation-msg" id="validation-timer-duration-input" role="alert"
        aria-live="assertive"></div>
    </section>

    <!-- ── To-Do List Panel ── -->
    <section class="glass-panel panel-tasks" id="panel-tasks" aria-label="To-do list">
      <!-- Loading skeleton -->
      <div class="skeleton-block skeleton-task" aria-hidden="true"></div>
      <div class="skeleton-block skeleton-task" aria-hidden="true"></div>

      <div class="tasks-header">
        <h2 class="panel-title">Tasks</h2>
        <span class="task-count" id="task-count" aria-live="polite">0 tasks</span>
      </div>

      <form class="task-add-form" id="task-add-form" novalidate aria-label="Add a new task">
        <label for="task-input" class="sr-only">New task</label>
        <input type="text" id="task-input" class="glass-input" placeholder="Add a task…" maxlength="200"
          autocomplete="off" aria-label="New task text" aria-describedby="validation-task-input" />
        <button type="submit" class="btn-accent" aria-label="Add task">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          Add
        </button>
      </form>
      <div class="validation-msg task-add-validation" id="validation-task-input" role="alert" aria-live="assertive">
      </div>

      <ul class="task-list" id="task-list" aria-label="Task list" aria-live="polite"></ul>
    </section>

    <!-- ── Quick Links Panel (Bottom Launchpad Dock) ── -->
    <section class="glass-panel panel-links" id="panel-links" aria-label="Quick links">
      <!-- Loading skeleton -->
      <div class="skeleton-block skeleton-link" aria-hidden="true"></div>

      <h2 class="panel-title">Quick Links</h2>

      <div class="links-grid" id="links-grid" aria-label="Saved links"></div>
      <p class="links-limit-msg" id="links-limit-msg" role="status" hidden>
        Maximum of 20 links reached.
      </p>

      <form class="add-link-form" id="add-link-form" novalidate aria-label="Add a new quick link">
        <div class="add-link-field">
          <label for="link-label-input" class="sr-only">Link label</label>
          <input type="text" id="link-label-input" class="glass-input" placeholder="Label" maxlength="50"
            autocomplete="off" aria-label="Link label" aria-describedby="validation-link-label-input" />
          <div class="validation-msg add-link-validation" id="validation-link-label-input" role="alert"
            aria-live="assertive"></div>
        </div>
        <div class="add-link-field">
          <label for="link-url-input" class="sr-only">Link URL</label>
          <input type="url" id="link-url-input" class="glass-input" placeholder="https://example.com" maxlength="2048"
            autocomplete="off" aria-label="Link URL" aria-describedby="validation-link-url-input" />
          <div class="validation-msg add-link-validation" id="validation-link-url-input" role="alert"
            aria-live="assertive"></div>
        </div>
        <button type="submit" class="btn-accent btn-add-link" id="add-link-btn" aria-label="Add quick link">
          Add Link
        </button>
      </form>
    </section>





  </main><!-- /.dashboard-grid -->

  <!-- ── Audio cue for Pomodoro completion ── -->
  <audio id="timer-audio" preload="auto" aria-hidden="true">
    <!--
      Inline base64-encoded short beep tone so the app works with no network.
      A real deployment would replace src with an actual audio file path.
    -->
    <source
      src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbv4lNLC1gpNXftH9JKixlrN/lsHxHKC5qs+PprnlEJTB2u+frrXZBIjJ9w+rurHM+HzSEx+3xrHA7HDaM0PP0q2w3GDiV2/b2qGk0FTue5Pn5pWYxEj2m7v38omMuEEC08v39n2ArDkO6+P7+nF4pC0bA/v//mVsoCUjE////llkoCEjM////klYmCErU////jlMkBkze////ilAiBFTo////hk0gA1z0////hkogAlj8////hkogAlj8////hkogAlj8////hkogAlj8////hkogAlj8"
      type="audio/wav" />
    Your browser does not support the audio element.
  </audio>

  <!-- ─────────────────────────────────────────────
       Template: Task item
       ───────────────────────────────────────────── -->
  <template id="tpl-task-item">
    <li class="task-item" data-id="">
      <button type="button" class="task-checkbox-btn" aria-checked="false" aria-label="Mark task complete"></button>
      <span class="task-text"></span>
      <input type="text" class="glass-input task-edit-input" maxlength="200" aria-label="Edit task text" hidden />
      <div class="task-edit-actions" hidden>
        <button type="button" class="btn-confirm btn-sm task-edit-confirm-btn" aria-label="Confirm edit">✓</button>
        <button type="button" class="btn-cancel btn-sm task-edit-cancel-btn" aria-label="Cancel edit">✕</button>
      </div>
      <button type="button" class="task-action-btn task-edit-btn" aria-label="Edit task">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
        </svg>
      </button>
      <button type="button" class="task-action-btn task-delete-btn" aria-label="Delete task">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
        </svg>
      </button>
    </li>
  </template>

  <!-- ─────────────────────────────────────────────
       Template: Quick-link button
       ───────────────────────────────────────────── -->
  <template id="tpl-quick-link">
    <div class="quick-link-item" data-id="">
      <a class="quick-link-btn" href="#" target="_blank" rel="noopener noreferrer" aria-label="">
        <span class="quick-link-label"></span>
      </a>
      <button type="button" class="quick-link-delete-btn" aria-label="Delete link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>
  </template>

  <!-- ─────────────────────────────────────────────
       Template: Toast notification
       ───────────────────────────────────────────── -->
  <template id="tpl-toast">
    <div class="toast" role="status" aria-live="polite" data-level="">
      <span class="toast-message"></span>
      <button type="button" class="toast-close-btn" aria-label="Dismiss notification">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>
  </template>

  <script src="js/app.js"></script>
</body>

</html>
